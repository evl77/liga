<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liga en Vivo</title>
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liga en Vivo">
<style>
:root{
  --bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#24314f;--txt:#e8edf7;--mut:#8b98b4;
  --acc:#22c55e;--live:#ef4444;--gold:#facc15;--blue:#3b82f6;--draw:#94a3b8;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 0 6px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chips button img{width:16px;height:16px;object-fit:contain}
.chips button.on{background:var(--acc);color:#04210f}
main{padding:0 16px calc(90px + var(--safe-b))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,18,32,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:6}
nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.weeknav button{padding:6px 12px;background:var(--card);border-radius:9px;font-size:13px}
.weeknav b{font-size:13px;color:var(--mut);font-weight:600;text-align:center}
.day{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 2px 6px;font-weight:700;display:flex;align-items:center;gap:6px}
.day img{width:16px;height:16px;object-fit:contain}
.match{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;background:var(--card);border-radius:14px;padding:12px 10px;margin-bottom:8px;gap:6px;width:100%;text-align:left}
.match.fav{box-shadow:inset 3px 0 0 var(--gold)}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm.away{flex-direction:row-reverse;text-align:right}
.tm img{width:26px;height:26px;object-fit:contain;flex:none}
.tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.mid{text-align:center}
.sc{font-size:20px;font-weight:800;letter-spacing:1px}
.st{font-size:11px;color:var(--mut);margin-top:2px}
.st.live{color:var(--live);font-weight:700}
.hr{font-size:16px;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:4px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
/* probabilidades */
.prob{grid-column:1/-1;margin-top:4px}
.prob .bars{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:2px}
.prob .bars div:nth-child(1){background:var(--acc)}
.prob .bars div:nth-child(2){background:var(--draw)}
.prob .bars div:nth-child(3){background:var(--blue)}
.prob .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
.prob .lbl b{color:var(--txt)}
.probbig{background:var(--card);border-radius:14px;padding:12px;margin:12px 0}
.probbig h4{margin:0 0 8px;font-size:13px}
.probbig .bars{height:10px}
.probbig .lbl{font-size:12.5px}
.note{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.4}
/* tablas */
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:14px;overflow:hidden;margin-top:8px}
th{color:var(--mut);font-weight:600;font-size:11px;padding:9px 4px;text-align:center}
td{padding:8px 4px;text-align:center;border-top:1px solid var(--line)}
tr.click{cursor:pointer}
td.t{text-align:left}
td.t div{display:flex;align-items:center;gap:7px;min-width:0}
td.t img{width:20px;height:20px;object-fit:contain;flex:none}
td.t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
td.p{font-weight:800}
td.pos{width:28px;font-weight:700;position:relative}
td.pos::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--z,transparent)}
tr.fav td{background:rgba(250,204,21,.07)}
.legend{font-size:11px;color:var(--mut);margin:10px 2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hide-s{display:none}
@media(min-width:420px){.hide-s{display:table-cell}}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px}
.card p{margin:6px 0;color:var(--mut);font-size:13px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.teams button{background:var(--card2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;border:2px solid transparent}
.teams button.on{border-color:var(--gold)}
.teams img{width:34px;height:34px;object-fit:contain}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#04210f;font-weight:700;padding:10px 14px;border-radius:10px;text-decoration:none;font-size:14px}
.btn.sec{background:var(--card2);color:var(--txt)}
.empty,.err{text-align:center;color:var(--mut);padding:36px 10px}
.err{color:#fca5a5}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .8s linear infinite;margin:40px auto}
@keyframes r{to{transform:rotate(1turn)}}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:8px 0 0}
/* hojas (detalle partido / equipo / jugador) */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;top:calc(24px + var(--safe-t));background:var(--bg);border-radius:18px 18px 0 0;overflow:auto;padding:10px 16px calc(24px + var(--safe-b));animation:up .2s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sbar{position:sticky;top:-10px;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--bg);margin:-10px -16px 0;padding:10px 12px 6px}
.sbar button{font-size:15px;color:var(--mut);padding:6px 10px;border-radius:9px;background:var(--card)}
.sbar .ttl{font-size:13px;color:var(--mut);font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:10px 0 6px}
.hero button{display:flex;flex-direction:column;align-items:center}
.hero img{width:56px;height:56px;object-fit:contain}
.hero .n{font-weight:700;font-size:14px;margin-top:4px}
.hero .n small{display:block;color:var(--acc);font-size:11px;font-weight:600}
.hero .sc{font-size:34px}
.meta{text-align:center;font-size:12px;color:var(--mut);margin-top:4px}
.tabs{display:flex;gap:6px;margin:14px 0 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--acc);color:#04210f}
.ev{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;gap:6px}
.ev .c{text-align:center;color:var(--mut);font-weight:700;font-size:12px}
.ev .r{text-align:left}.ev .l{text-align:right}
.ev small{display:block;color:var(--mut);font-size:11px}
.bar{margin:10px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .lb span{color:var(--mut);font-size:12px}
.bar .tr{display:flex;gap:4px;height:7px}
.bar .tr div{border-radius:4px}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lu h4{margin:6px 0;font-size:13px}
.lu h4 small{color:var(--mut);font-weight:500}
.pl{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;width:100%;text-align:left;align-items:center}
.pl b{width:20px;color:var(--mut);text-align:right;flex:none}
.pl em{font-style:normal;color:var(--mut);font-size:11px;margin-left:auto;white-space:nowrap}
.sub{color:var(--mut)}
/* equipo */
.thead{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.thead img{width:64px;height:64px;object-fit:contain}
.thead h2{margin:0;font-size:20px}
.thead p{margin:3px 0 0;color:var(--mut);font-size:13px}
.star{margin-left:auto;font-size:26px;color:var(--mut)}
.star.on{color:var(--gold)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.info a,.info div.box{background:var(--card);border-radius:12px;padding:10px;text-decoration:none;color:var(--txt);display:flex;gap:10px;align-items:center;min-height:62px}
.info .ic{font-size:22px}
.info small{display:block;color:var(--mut);font-size:11px}
.info b{font-size:13px;display:block}
.coach{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.ph{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 2px 4px;font-weight:700}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px;width:100%;text-align:left}
.prow .ph{width:38px;height:38px;font-size:13px}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{color:var(--mut);font-size:11.5px;display:flex;align-items:center;gap:4px}
.prow .nm small img{width:14px;height:10px;object-fit:cover;border-radius:2px}
.prow .num{font-weight:800;color:var(--mut);width:24px;text-align:center}
.prow .ga{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.prow .ga b{color:var(--txt)}
/* jugador */
.phero{text-align:center;margin:10px 0}
.phero .ph{width:110px;height:110px;margin:0 auto;font-size:34px}
.phero h2{margin:10px 0 2px;font-size:21px}
.phero p{margin:2px 0;color:var(--mut);font-size:13px;display:flex;justify-content:center;align-items:center;gap:6px}
.phero p img{width:20px;height:14px;object-fit:cover;border-radius:2px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.kv b{display:block;font-size:20px}
.kv small{color:var(--mut);font-size:11px}
.facts{background:var(--card);border-radius:12px;padding:4px 12px}
.facts div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.facts div:last-child{border:0}
.facts span{color:var(--mut)}
.bio{font-size:13px;color:var(--mut);line-height:1.5;margin:10px 2px}
.res{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:5px;font-size:11px;font-weight:800;text-align:center;color:#04210f}
.res.W{background:var(--acc)}.res.D{background:var(--draw)}.res.L{background:var(--live);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + var(--safe-b));background:var(--acc);color:#04210f;font-weight:700;padding:12px 14px;border-radius:12px;z-index:30;display:none}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
.flag{width:22px;height:15px;object-fit:cover;border-radius:2px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Liga <span>en Vivo</span></h1>
    <button id="refresh" aria-label="Actualizar" title="Actualizar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
    </button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="view"></main>

<nav id="nav">
  <button data-v="partidos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>Partidos</button>
  <button data-v="tabla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Clasificación</button>
  <button data-v="ranking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Ranking FIFA</button>
  <button data-v="favs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Favoritos</button>
</nav>

<div class="sheet" id="sheet"><div class="bd"></div><div class="pn" id="pn"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const API = 'https://site.api.espn.com/apis/site/v2/sports/soccer/';
const API2 = 'https://site.api.espn.com/apis/v2/sports/soccer/';
const LOGO = id => `https://a.espncdn.com/i/leaguelogos/soccer/500/${id}.png`;
// Competiciones. model: probabilidades; home: ventaja local histórica de la competición (goles local / visitante)
const COMPS = [
  {id:'hoy', name:'Hoy', short:'⚡ Hoy'},
  {id:'esp.1', name:'LaLiga EA Sports', short:'1ª División', logo:15, model:true, home:1.30},
  {id:'esp.2', name:'LaLiga Hypermotion', short:'2ª División', logo:107, model:true, home:1.32},
  {id:'uefa.champions', name:'UEFA Champions League', short:'Champions', logo:2, model:true, home:1.28},
  {id:'uefa.europa', name:'UEFA Europa League', short:'Europa League', logo:2310, model:true, home:1.25},
  {id:'uefa.nations', name:'UEFA Nations League', short:'Nations League', logo:2395},
  {id:'fifa.worldq.uefa', name:'Clasificación Mundial (UEFA)', short:'Clasif. Mundial', logo:4},
  {id:'uefa.euroq', name:'Clasificación Eurocopa', short:'Clasif. Eurocopa', logo:74},
];
const CMAP = Object.fromEntries(COMPS.map(c => [c.id, c]));
const CLUB_COMPS = ['esp.1','esp.2','uefa.champions','uefa.europa'];
const TZ = 'Europe/Madrid';
const POLL_LIVE = 30000, POLL_IDLE = 180000;

const S = {
  comp: localStorage.getItem('comp') || 'hoy',
  view: 'partidos', week: 0,
  favs: load('favs', []), scores: load('scores', {}),
  notif: localStorage.getItem('notif') === '1',
  cache: {}, stack: [],
};
function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isFav = id => S.favs.some(f => String(f.id) === String(id));
const initials = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();

/* ---------- red ---------- */
async function get(url){
  let last;
  for(let i = 0; i < 2; i++){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }catch(e){ last = e; await new Promise(r => setTimeout(r, 500)) }
  }
  throw new Error((last && last.message) || 'Sin conexión con la fuente de datos');
}
async function cached(key, ttl, fn){
  const c = S.cache[key];
  if(c && Date.now() - c.t < ttl) return c.v;
  const v = await fn(); S.cache[key] = {t:Date.now(), v}; return v;
}
// La fuente solo acepta días sueltos: se pide cada día y se juntan
async function sbDays(lg, days){
  const res = await Promise.allSettled(days.map(d => get(`${API}${lg}/scoreboard?dates=${ymd(d)}`)));
  if(res.every(r => r.status === 'rejected')) throw res[0].reason;
  const seen = new Map();
  res.forEach(r => r.status === 'fulfilled' && (r.value.events||[]).forEach(e => seen.set(e.id, e)));
  return [...seen.values()];
}

/* ---------- fechas ---------- */
function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') }
function weekRange(off){
  const now = new Date(), day = (now.getDay()+6)%7;
  const mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate() - day + off*7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return [mon, sun];
}
function daysOf(a, b){ const out = [], d = new Date(a); while(d <= b){ out.push(new Date(d)); d.setDate(d.getDate()+1) } return out }
const fmtDay = d => new Date(d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:TZ});
const fmtHour = d => new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
const fmtShort = d => new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short',timeZone:TZ});
const fmtDate = d => new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric',timeZone:TZ});

/* ---------- normalización ESPN ---------- */
function norm(ev, lg){
  const c = ev.competitions?.[0] || {};
  const h = c.competitors?.find(x => x.homeAway === 'home') || c.competitors?.[0] || {};
  const a = c.competitors?.find(x => x.homeAway === 'away') || c.competitors?.[1] || {};
  const st = ev.status?.type || c.status?.type || {};
  const sc = s => typeof s === 'object' && s ? (s.displayValue ?? s.value ?? '') : (s ?? '');
  const team = t => ({id:t.team?.id || t.id, name:t.team?.shortDisplayName || t.team?.displayName || '', logo:t.team?.logo || t.team?.logos?.[0]?.href || '', score:sc(t.score), winner:t.winner});
  return {
    id: ev.id, lg, date: ev.date, state: st.state, detail: st.shortDetail || st.detail || '',
    clock: ev.status?.displayClock || c.status?.displayClock || '',
    home: team(h), away: team(a), venue: c.venue?.fullName || '',
    goals: (c.details||[]).filter(d => d.scoringPlay),
    round: ev.season?.slug || '',
  };
}

/* ---------- clasificación (con grupos) ---------- */
function parseStandings(d){
  const groups = (d.children && d.children.length ? d.children : [d]).map(ch => {
    const grp = ch.standings || {};
    const st = (e, n) => { const s = (e.stats||[]).find(x => x.name === n || x.type === n); return s ? (s.displayValue ?? s.value) : '' };
    const num = (e, n) => { const s = (e.stats||[]).find(x => x.name === n); return s ? +s.value || 0 : 0 };
    const rows = (grp.entries||[]).map(e => ({
      id:e.team?.id, name:e.team?.shortDisplayName || e.team?.displayName, logo:e.team?.logos?.[0]?.href || '',
      pos:+st(e,'rank') || 0, pj:st(e,'gamesPlayed'), g:st(e,'wins'), em:st(e,'ties'), p:st(e,'losses'),

/* ---------- modelo de probabilidades (Poisson + Dixon-Coles) ---------- */
function teamStrengths(st){
  const rows = st.groups.flatMap(g => g.rows);
  const gp = rows.reduce((s,r) => s + r.ngp, 0), gf = rows.reduce((s,r) => s + r.ngf, 0);
  const mu = gp ? gf / gp : 1.3, K = 5; // K partidos "virtuales" en la media: evita extremos a principio de temporada
  const m = {};
  rows.forEach(r => { m[r.id] = {att:(r.ngf + K*mu)/(r.ngp + K)/mu, def:(r.nga + K*mu)/(r.ngp + K)/mu} });
  return {mu, m};
}
function probs(lg, hid, aid, str){
  const c = CMAP[lg]; if(!c?.model || !str) return null;
  const H = str.m[hid], A = str.m[aid]; if(!H || !A) return null;
  const hf = Math.sqrt(c.home);
  const lh = str.mu * H.att * A.def * hf, la = str.mu * A.att * H.def / hf;
  const pois = (l, k) => { let p = Math.exp(-l); for(let i = 1; i <= k; i++) p *= l / i; return p };
  const rho = -0.08;
  const tau = (x, y) => x===0&&y===0 ? 1 - lh*la*rho : x===0&&y===1 ? 1 + lh*rho : x===1&&y===0 ? 1 + la*rho : x===1&&y===1 ? 1 - rho : 1;
  let w = 0, d = 0, l = 0;
  for(let x = 0; x <= 9; x++) for(let y = 0; y <= 9; y++){
    const p = pois(lh, x) * pois(la, y) * tau(x, y);
    if(x > y) w += p; else if(x === y) d += p; else l += p;
  }
  const t = w + d + l;
  return {w:w/t, d:d/t, l:l/t, lh, la};
}
const pct = x => Math.round(x * 100);
function probHTML(p, big, hn, an){
  if(!p) return '';
  const W = pct(p.w), D = pct(p.d), L = 100 - W - D;
  return `<div class="${big ? 'probbig' : 'prob'}">${big ? '<h4>📊 Probabilidades</h4>' : ''}
    <div class="bars"><div style="flex:${W}"></div><div style="flex:${D}"></div><div style="flex:${L}"></div></div>
    <div class="lbl"><span>${big ? esc(hn) + ' ' : '1 '}<b>${W}%</b></span><span>Empate <b>${D}%</b></span><span>${big ? esc(an) + ' ' : '2 '}<b>${L}%</b></span></div>
    ${big ? `<div class="note">Goles esperados: ${p.lh.toFixed(1)} – ${p.la.toFixed(1)}. Modelo estadístico (Poisson) con los goles a favor y en contra de cada equipo en esta competición y la ventaja histórica de jugar en casa. Es una estimación, no una predicción segura.</div>` : ''}
  </div>`;
}

const STAT_ES = {possessionPct:'Posesión',totalShots:'Tiros',shotsOnTarget:'Tiros a puerta',wonCorners:'Córners',foulsCommitted:'Faltas',yellowCards:'Amarillas',redCards:'Rojas',offsides:'Fueras de juego',saves:'Paradas',accuratePasses:'Pases buenos',totalPasses:'Pases',passPct:'% pases',totalTackles:'Entradas',interceptions:'Intercepciones',totalCrosses:'Centros',totalClearance:'Despejes',blockedShots:'Tiros bloqueados'};
const STAT_ORDER = Object.keys(STAT_ES);
function statsHTML(d, H, A){

    if(n === 'passPct' && vh <= 1 && va <= 1){ vh = Math.round(vh*100); va = Math.round(va*100) }

function lineupHTML(d, H, A){

function h2hHTML(d, H, A){
  const ser = (d.headToHeadGames || d.seasonseries || []).find(s => /head/i.test(s.type || s.seriesLabel || '')) || (d.seasonseries || [])[0];
  const games = ser?.events || d.headToHeadGames?.[0]?.events || [];
  const l5 = d.lastFiveGames || [];
  let html = '';
  if(games.length){
    let w = 0, dr = 0, l = 0;
    const rows = games.slice(0, 8).map(g => {
      const hc = g.competitors?.find(x => x.homeAway === 'home') || {}, ac = g.competitors?.find(x => x.homeAway === 'away') || {};
      const hs = +hc.score || 0, as = +ac.score || 0;
      const hIsH = String(hc.id || hc.team?.id) === String(H.team?.id);
      const ours = hIsH ? hs : as, theirs = hIsH ? as : hs;
      if(g.status?.type?.completed !== false){ ours > theirs ? w++ : ours === theirs ? dr++ : l++ }
      return `<div class="facts"><div><span>${fmtShort(g.date)} ${new Date(g.date).getFullYear()}</span><b>${esc(hc.team?.abbreviation || hc.team?.displayName || '')} ${hs} - ${as} ${esc(ac.team?.abbreviation || ac.team?.displayName || '')}</b></div></div>`;
    });
    html += `<div class="kv"><div><b>${w}</b><small>Gana ${esc(H.team?.shortDisplayName)}</small></div><div><b>${dr}</b><small>Empates</small></div><div><b>${l}</b><small>Gana ${esc(A.team?.shortDisplayName)}</small></div></div>${rows.join('<div style="height:6px"></div>')}`;
  }
  if(l5.length){
    html += `<div class="grp">Últimos partidos</div>` + l5.map(t => {
      const evs = (t.events || []).slice(0,5).map(e => { const r = (e.gameResult || '').toUpperCase(); const k = r === 'W' || r === 'G' ? 'W' : r === 'D' || r === 'E' ? 'D' : r === 'L' || r === 'P' ? 'L' : ''; return k ? `<span class="res ${k}">${k==='W'?'V':k==='D'?'E':'D'}</span>` : '' }).join(' ');
      return `<div class="prow"><img src="${esc(t.team?.logo||'')}" alt="" style="width:26px;height:26px;object-fit:contain"><div class="nm"><b>${esc(t.team?.displayName||'')}</b></div><div>${evs}</div></div>`;
    }).join('');
  }
  return html || '<div class="empty">Sin datos de enfrentamientos previos.</div>';
}

/* ---------- Wikipedia (entrenador y fotos) ---------- */
async function wikiSummary(title){
  try{ return await get(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g,'_'))}`) }catch{ return null }
}
async function wikiSearch(q){
  try{ const r = await get(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=3`); return r.query?.search?.map(x => x.title) || [] }catch{ return [] }
}
const clean = s => String(s||'').replace(/<ref[^>]*>.*?<\/ref>|<ref[^>]*\/>/g,'').replace(/\{\{[^{}]*\}\}/g,'').replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g,'$1').replace(/<[^>]+>/g,'').replace(/'''?/g,'').trim();
async function getCoach(teamName, national){
  return cached('coach:'+teamName, 86400000, async () => {
    const titles = await wikiSearch(national ? `Selección de fútbol de ${teamName}` : `${teamName} club de fútbol`);
    for(const t of titles.slice(0,2)){
      try{
        const w = await get(`https://es.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(t)}&prop=wikitext&section=0&format=json&origin=*&formatversion=2`);
        const m = (w.parse?.wikitext || '').match(/\|\s*(?:entrenador|seleccionador|director técnico)\s*=\s*([^\n]+)/i);
        if(m){
          const link = (m[1].match(/\[\[([^|\]]+)/) || [])[1];
          const name = clean(m[1]);
          if(!name) continue;
          const sum = link ? await wikiSummary(link) : null;
          return {name, photo: sum?.thumbnail?.source || '', desc: sum?.description || '', extract: sum?.extract || '', url: sum?.content_urls?.mobile?.page || ''};
        }
      }catch{}
    }
    return null;
  });
}
async function wikiPlayer(name){
  return cached('wp:'+name, 86400000, async () => {
    const titles = await wikiSearch(`${name} futbolista`);
    for(const t of titles.slice(0,2)){
      const s = await wikiSummary(t);
      if(s && /futbol/i.test((s.description||'') + (s.extract||'').slice(0,200))) return s;
    }
    return null;
  });
}

function statOf(a, name){
  for(const c of a.statistics?.splits?.categories || []) for(const s of c.stats || []) if(s.name === name) return +s.value || 0;
  return 0;
}

    }catch(e){ box.innerHTML = `<div class="err">${esc(e.message)}</div>` }
  };
  $('#favSeg').querySelectorAll('button').forEach(b => b.onclick = () => { $('#favSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b)); paint(b.dataset.l) });
  paint('esp.1');
}

/* ---------- notificaciones ---------- */
let swReg = null;
async function enableNotif(){
  if(!('Notification' in window)) return toast('Este navegador no admite notificaciones');
  const p = await Notification.requestPermission();
  if(p === 'granted'){ S.notif = true; localStorage.setItem('notif','1'); toast('Avisos de gol activados'); notify('⚽ Liga en Vivo','Te avisaré de cada gol de tus favoritos') }
  render();
}
async function notify(title, body, tag){
  if(!S.notif || Notification.permission !== 'granted') return;
  try{
    const reg = swReg || await navigator.serviceWorker?.ready;
    if(reg) return reg.showNotification(title, {body, tag: tag || String(Date.now()), icon:'icon-192.png', badge:'icon-192.png', vibrate:[200,100,200], renotify:true});
    new Notification(title, {body, icon:'icon-192.png'});
  }catch(e){ console.warn(e) }
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 3000) }
function checkGoals(evs){
  let changed = false;
  for(const e of evs){
    if(!isFav(e.home.id) && !isFav(e.away.id)) continue;
    if(e.state === 'pre') continue;
    const now = `${+e.home.score||0}-${+e.away.score||0}`, prev = S.scores[e.id];
    if(prev === undefined){ S.scores[e.id] = now; changed = true; continue }
    if(prev !== now){
      const [ph, pa] = prev.split('-').map(Number), nh = +e.home.score||0, na = +e.away.score||0;
      const sc = nh > ph ? e.home : na > pa ? e.away : null;
      if(sc){
        const last = e.goals[e.goals.length-1];
        const who = last?.athletesInvolved?.[0]?.displayName, min = last?.clock?.displayValue;
        notify(`${isFav(sc.id)?'⚽ ¡GOL del':'😬 Gol del'} ${sc.name}!`, `${e.home.name} ${nh} - ${na} ${e.away.name}${who?` · ${who}`:''}${min?` (${min})`:''}`, 'gol-'+e.id+'-'+now);
        toast(`⚽ ${e.home.name} ${nh} - ${na} ${e.away.name}`);
      }
      S.scores[e.id] = now; changed = true;
    }
  }
  if(changed){ const k = Object.keys(S.scores); if(k.length > 300) k.slice(0, k.length-300).forEach(x => delete S.scores[x]); save('scores', S.scores) }
}
let timer = null;
async function pollFavs(){
  let anyLive = false;
  if(S.favs.length){
    const lgs = [...new Set([...S.favs.map(f => f.league || 'esp.1'), 'uefa.champions', 'uefa.europa'])];
    await Promise.all(lgs.map(async lg => {
      try{
        const evs = (await sbDays(lg, [new Date()])).map(e => norm(e, lg));
        checkGoals(evs);
        if(evs.some(e => e.state === 'in' && (isFav(e.home.id) || isFav(e.away.id)))) anyLive = true;
      }catch{}
    }));
  }
  return anyLive;
}
async function tick(){
  const live = await pollFavs();
  if(S.view === 'partidos' && !S.stack.length && document.querySelector('.st.live')) softRefresh();
  if(S.openId && S.stack.length){ try{ const d = await get(`${API}${S.openLg}/summary?event=${S.openId}`); const det = $('#det'); if(S.openId && det) renderMatch(det, d, S.openId, S.openLg, S.openStr) }catch{} }
  schedule(false, live || !!document.querySelector('.st.live'));
}
function schedule(now, live){ clearTimeout(timer); timer = setTimeout(tick, now ? 500 : (live ? POLL_LIVE : POLL_IDLE)) }
function softRefresh(){ S.silent = true; Promise.resolve(viewPartidos()).finally(() => S.silent = false) }

/* ---------- navegación ---------- */
function render(keepScroll){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  renderChips();
  if(!keepScroll) window.scrollTo(0,0);
  if(S.view === 'partidos') return viewPartidos();
  if(S.view === 'tabla') return viewTabla();
  if(S.view === 'ranking') return viewRanking();
  return viewFavs();
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { S.view = b.dataset.v; render() });
$('#refresh').onclick = () => { S.cache = {}; render(); schedule(true) };
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') schedule(true) });
document.addEventListener('error', e => { if(e.target.tagName === 'IMG' && !e.target.closest('.ph')) e.target.style.visibility = 'hidden' }, true);
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(()=>{});
render();
schedule(true);
</script>
